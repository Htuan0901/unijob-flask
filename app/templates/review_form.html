{% extends 'base.html' %}
{% from '_macros.html' import field %}
{% block title %}Đánh giá{% endblock %}
{% block content %}
<div class="container" style="max-width:600px">
  <div class="card card-body shadow-sm">
    <h4>Đánh giá {{ target }}</h4>
    <p class="text-muted">Công việc: {{ job.title }}</p>
    <form method="post">{{ form.hidden_tag() }}{{ field(form.rating) }}{{ field(form.comment) }}
      <button class="btn btn-primary">Gửi đánh giá</button></form>
  </div>
</div>
{% endblock %}
